services:
  calliope-runner:
    build:
      context: .
      dockerfile: Dockerfile
    image: calliope-runner:latest
    container_name: calliope-runner
    ports:
      - "5000:5000"
    restart: unless-stopped
    volumes:
      - ./python:/app/python:ro
      - ./public/templates:/app/public/templates:ro
    # Override CMD for live-reload during development:
    # command: ["uvicorn", "python.calliope_service:app", "--host", "0.0.0.0", "--port", "5000", "--reload"]
    # Optional: mount a local solvers dir if you prefer bundled binaries over coinor-cbc
    # volumes:
    #   - ./solvers/linux:/app/solvers/linux:ro
    environment:
      - CALLIOPE_SOLVER_DIR=
      # Uncomment to point at a live OEO Tech Database API:
      # - OEO_API_URL=http://host.docker.internal:8005
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

  calliope07-runner:
    build:
      context: .
      dockerfile: Dockerfile.calliope07
    image: calliope07-runner:latest
    container_name: calliope07-runner
    ports:
      - "5002:5002"
    restart: unless-stopped
    volumes:
      - ./python:/app/python:ro
      - ./public/templates:/app/public/templates:ro
    environment:
      - TEMPO_RUNNER_MODULE=calliope07_runner
      - CALLIOPE_SOLVER_DIR=
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 60s

  pypsa-runner:
    build:
      context: .
      dockerfile: Dockerfile.pypsa
    image: pypsa-runner:latest
    container_name: pypsa-runner
    ports:
      - "5003:5003"
    restart: unless-stopped
    volumes:
      - ./python:/app/python:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5003/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  osemosys-runner:
    build:
      context: .
      dockerfile: Dockerfile.osemosys
    image: osemosys-runner:latest
    container_name: osemosys-runner
    ports:
      - "5004:5004"
    restart: unless-stopped
    volumes:
      - ./python:/app/python:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5004/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
